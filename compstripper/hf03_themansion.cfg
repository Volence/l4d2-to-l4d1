; Ported from SirPlease/L4D2-Competitive-Rework cfg/stripper/zonemod/maps/hf03_themansion.cfg
; by l4d2to1/stripper2to1.py, matches checked against the converted BSP. Lines tagged [L4D1] say
; what changed; blocks commented out under them have no L4D1 equivalent.
;
; hf03_themansion: Haunted Forest
; Positions are from the BSP and game flow (flowdump); check them in game with getpos / !cur.
;
; start (info_player_start) 3027 420 -47
; end (info_changelevel)    -3462 1250 440
; max flow                  14752
; Panic Event        ~ 32.3%  relay_piano  at -903 -859 222
; no bosses          ~ 83.6% to ~100.0%  (hf_all_noboss, now mapinfo ban windows)
; !! Director Script c1_mall_ambient at ~  0.5% (trigger_once) has no L4D1 equivalent: rebuild by hand
;

; =====================================================
; ===================   CUSTOMOGL   ===================
; ================= Haunted Forest 3 ==================
; =====================================================

; Force both alt paths to be available
filter:
{
	"classname" "logic_case"
	"targetname" "case_altpaths"
}
{
	"targetname" "brush_altpath1"
}
{
	"targetname" "prop_altpath1"
}
{
	"targetname" "brush_altpath2"
}
{
	"targetname" "prop_altpath2"
}
{
	"targetname" "navblocker_path2"
}
{
	"targetname" "navblocker_path1"
}
{
	"targetname" "door_altpath"
}

; --- Remove annoying repeating sounds~
filter:
{
	"hammerid" "4320"
}
{
	"hammerid" "4792"
}

; Remove fake tank sounds
filter:
{
	"targetname" "relay_faketank"
}

;New Barricade to force survivors down one of the paths
add:
{
	"solid" "6"
	"origin" "-3176 -760 267"
	"angles" "0 0 0"
	"model" "models/props_unique/wooden_barricade.mdl"
	"classname" "prop_dynamic"
}
{
	"solid" "6"
	"origin" "-3234 -832 267"
	"angles" "0 0 0"
	"model" "models/props/cs_militia/crate_extralargemill.mdl"
	"classname" "prop_dynamic"
}

; Remove horde that spawns with piano tank
modify:
; [L4D1] outputs rewritten for L4D1 (comma separators, L4D1 input names)
;{
;	match:
;	{
;		"targetname" "relay_piano"
;	}
;	delete:
;	{
;		"OnTrigger" "director,ForcePanicEvent,,4,1"
;	}
;}
{
	match:
	{
		"targetname" "relay_piano"
	}
	delete:
	{
		"OnTrigger" "director,PanicEvent,,4,1"
	}
}

; Remove pills from end safe room
filter:
; [L4D1] the converter renamed these (1 L4D2 entities, 0 L4D1 matches by the original keys): matched by hammerid instead
;{
;	"origin" "-3067.74 897.31 448"
;	"classname" "weapon_item_spawn"
;}
{
	"hammerid" "152105"
}
