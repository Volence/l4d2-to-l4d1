	}
	replace:
	{
		"origin" "-11275 4975 126.821"
	}
}
{
	match:
	{
		"targetname" "intro_train"
	}
	replace:
	{
		"target" "track08"
		"origin" "-11283 4975 129"
	}
}
{
	match:
	{
		"classname" "path_track"
	}
	replace:
	{
		"orientationtype" "1"
	}
}
{
